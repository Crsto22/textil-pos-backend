#Perfil activo
spring.profiles.active=prod
spring.config.import=optional:file:.env[.properties]

# Nombre de la aplicación
spring.application.name=sistematextil

# Puerto del servidor
server.port=8080

# Los runners del agente, pagos y outbox no deben bloquearse entre si.
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:4}

# Configuración de Base de Datos Local (MySQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool JDBC. Los valores pueden ajustarse por entorno sin reconstruir la imagen.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME_MS:300000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:20000}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Evita conservar EntityManager/conexiones JDBC durante respuestas largas como SSE.
spring.jpa.open-in-view=false

# CONFIGURACIÓN JWT
application.jwt.secret-key=${JWT_SECRET}
application.jwt.token-prefix=Bearer
application.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
application.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

# CONFIGURACIÓN PAGINACIÓN
application.pagination.default-size=10

# CONFIGURACIÓN COOKIE (refresh token)
application.jwt.cookie-secure=${COOKIE_SECURE:true}
application.jwt.cookie-domain=${COOKIE_DOMAIN:}
application.jwt.cookie-same-site=${COOKIE_SAME_SITE:Lax}

# CONFIGURACIÓN CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
cors.max-age=${CORS_MAX_AGE:3600}

# Seguridad ADMS ZKTeco
asistencia.adms.max-events=${ASISTENCIA_ADMS_MAX_EVENTS:1000}
asistencia.adms.max-past-days=${ASISTENCIA_ADMS_MAX_PAST_DAYS:7}
asistencia.adms.max-future-minutes=${ASISTENCIA_ADMS_MAX_FUTURE_MINUTES:10}
asistencia.adms.max-body-bytes=${ASISTENCIA_ADMS_MAX_BODY_BYTES:262144}

# Actuator: solo health en produccion
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Tomcat recicla estas solicitudes de forma segura; evita imprimir el stack de diagnostico INFO.
logging.level.org.apache.catalina.connector.CoyoteAdapter=WARN

asistencia.duplicado-segundos=${ASISTENCIA_DUPLICADO_SEGUNDOS:120}


#AWS (variables de entorno / .env)
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:sistema-textil-cris-2026}
aws.s3.sunat.bucket=${AWS_S3_SUNAT_BUCKET:}

# Almacenamiento local
storage.base-path=${STORAGE_BASE_PATH:storage}

# Multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Facturacion electronica SUNAT
sunat.mode=${SUNAT_MODE:disabled}
sunat.cert-base-path=${SUNAT_CERT_BASE_PATH:${STORAGE_BASE_PATH:storage}/sunat/certificados}
sunat.cert-max-file-size-mb=${SUNAT_CERT_MAX_FILE_SIZE_MB:5}
sunat.crypto-key=${SUNAT_CRYPTO_KEY:}
sunat.job.fixed-delay-ms=${SUNAT_JOB_FIXED_DELAY_MS:15000}
sunat.job.batch-size=${SUNAT_JOB_BATCH_SIZE:10}
sunat.job.max-retries=${SUNAT_JOB_MAX_RETRIES:10}
sunat.job.lock-minutes=${SUNAT_JOB_LOCK_MINUTES:10}

# Dashboard sistema: verificacion de disponibilidad SUNAT
dashboard.sunat.health-timeout-ms=${DASHBOARD_SUNAT_HEALTH_TIMEOUT_MS:5000}
dashboard.sunat.health-cache-ttl-seconds=${DASHBOARD_SUNAT_HEALTH_CACHE_TTL_SECONDS:60}

# Consulta de documentos SUNAT
external.sunat-consulta.base-url=${SUNAT_CONSULTA_BASE_URL:https://ww1.sunat.gob.pe/ol-ti-itfisdenreg/itfisdenreg.htm}

# Fallback apisperu.com cuando SUNAT no responde
external.documento-consulta.api-token=${DOCUMENTO_CONSULTA_API_TOKEN:}
external.documento-consulta.apisperu-base-url=${APISPERU_CONSULTA_BASE_URL:https://dniruc.apisperu.com/api/v1}

# Brevo correos transaccionales ecommerce
brevo.enabled=${BREVO_ENABLED:false}
brevo.api-key=${BREVO_API_KEY:}

# Gemini usa la credencial cifrada de cada conexion para interpretar y analizar comprobantes.
crm.whatsapp.ai.gemini.api-key=${GEMINI_API_KEY:}
crm.whatsapp.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
crm.whatsapp.ai.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:60000}
crm.whatsapp.agent.bootstrap.max-output-tokens=${CRM_WHATSAPP_AGENT_BOOTSTRAP_MAX_OUTPUT_TOKENS:450}
crm.whatsapp.agent.context.recent-message-limit=${CRM_WHATSAPP_AGENT_CONTEXT_MESSAGE_LIMIT:30}
crm.whatsapp.agent.context.tool-result-limit=${CRM_WHATSAPP_AGENT_CONTEXT_TOOL_LIMIT:12}
crm.whatsapp.agent.optimization.compact-classifier-enabled=${CRM_WHATSAPP_AGENT_COMPACT_CLASSIFIER_ENABLED:false}
crm.whatsapp.agent.optimization.compact-context-enabled=${CRM_WHATSAPP_AGENT_COMPACT_CONTEXT_ENABLED:false}
crm.whatsapp.agent.optimization.no-tools-response-enabled=${CRM_WHATSAPP_AGENT_NO_TOOLS_RESPONSE_ENABLED:false}
crm.whatsapp.agent.batch.window-ms=${CRM_WHATSAPP_AGENT_BATCH_WINDOW_MS:5000}
crm.whatsapp.agent.batch.context-window-ms=${CRM_WHATSAPP_AGENT_BATCH_CONTEXT_WINDOW_MS:30000}
crm.whatsapp.agent.batch.max-messages=${CRM_WHATSAPP_AGENT_BATCH_MAX_MESSAGES:15}
crm.whatsapp.agent.job.max-attempts=${CRM_WHATSAPP_AGENT_JOB_MAX_ATTEMPTS:3}
crm.whatsapp.agent.job.lease-ms=${CRM_WHATSAPP_AGENT_JOB_LEASE_MS:90000}
crm.whatsapp.agent.job.retry-base-ms=${CRM_WHATSAPP_AGENT_JOB_RETRY_BASE_MS:2000}
crm.whatsapp.agent.job.recovery-initial-delay-ms=${CRM_WHATSAPP_AGENT_JOB_RECOVERY_INITIAL_DELAY_MS:5000}
crm.whatsapp.agent.job.recovery-delay-ms=${CRM_WHATSAPP_AGENT_JOB_RECOVERY_DELAY_MS:10000}
crm.whatsapp.agent.outbox.max-attempts=${CRM_WHATSAPP_AGENT_OUTBOX_MAX_ATTEMPTS:5}
crm.whatsapp.agent.outbox.lease-seconds=${CRM_WHATSAPP_AGENT_OUTBOX_LEASE_SECONDS:90}
crm.whatsapp.agent.outbox.batch-size=${CRM_WHATSAPP_AGENT_OUTBOX_BATCH_SIZE:20}
crm.whatsapp.agent.outbox.initial-delay-ms=${CRM_WHATSAPP_AGENT_OUTBOX_INITIAL_DELAY_MS:3000}
crm.whatsapp.agent.outbox.delay-ms=${CRM_WHATSAPP_AGENT_OUTBOX_DELAY_MS:500}
crm.whatsapp.agent.payment-vision.minimum-confidence=${CRM_WHATSAPP_AGENT_PAYMENT_VISION_MINIMUM_CONFIDENCE:85}
crm.whatsapp.agent.payment-vision.max-output-tokens=${CRM_WHATSAPP_AGENT_PAYMENT_VISION_MAX_OUTPUT_TOKENS:1200}
crm.whatsapp.agent.payment-vision.initial-delay-ms=${CRM_WHATSAPP_AGENT_PAYMENT_VISION_INITIAL_DELAY_MS:3000}
crm.whatsapp.agent.payment-vision.delay-ms=${CRM_WHATSAPP_AGENT_PAYMENT_VISION_DELAY_MS:1000}
crm.whatsapp.agent.payment-vision.stale-minutes=${CRM_WHATSAPP_AGENT_PAYMENT_VISION_STALE_MINUTES:2}
crm.whatsapp.agent.payment-vision.zone-id=${CRM_WHATSAPP_AGENT_PAYMENT_VISION_ZONE_ID:America/Lima}
crm.whatsapp.agent.size-guide.minimum-confidence=${CRM_WHATSAPP_AGENT_SIZE_GUIDE_MINIMUM_CONFIDENCE:85}
crm.whatsapp.agent.size-guide.max-output-tokens=${CRM_WHATSAPP_AGENT_SIZE_GUIDE_MAX_OUTPUT_TOKENS:5000}
crm.whatsapp.agent.size-guide.max-attempts=${CRM_WHATSAPP_AGENT_SIZE_GUIDE_MAX_ATTEMPTS:3}
crm.whatsapp.agent.size-guide.scan-initial-delay-ms=${CRM_WHATSAPP_AGENT_SIZE_GUIDE_SCAN_INITIAL_DELAY_MS:15000}
crm.whatsapp.agent.size-guide.scan-delay-ms=${CRM_WHATSAPP_AGENT_SIZE_GUIDE_SCAN_DELAY_MS:60000}
crm.whatsapp.agent.size-guide.runner-initial-delay-ms=${CRM_WHATSAPP_AGENT_SIZE_GUIDE_RUNNER_INITIAL_DELAY_MS:20000}
crm.whatsapp.agent.size-guide.runner-delay-ms=${CRM_WHATSAPP_AGENT_SIZE_GUIDE_RUNNER_DELAY_MS:3000}
crm.whatsapp.agent.fulfillment-media.initial-delay-ms=${CRM_WHATSAPP_AGENT_FULFILLMENT_MEDIA_INITIAL_DELAY_MS:3000}
crm.whatsapp.agent.fulfillment-media.delay-ms=${CRM_WHATSAPP_AGENT_FULFILLMENT_MEDIA_DELAY_MS:1000}
crm.whatsapp.agent.sale.initial-delay-ms=${CRM_WHATSAPP_AGENT_SALE_INITIAL_DELAY_MS:3000}
crm.whatsapp.agent.sale.delay-ms=${CRM_WHATSAPP_AGENT_SALE_DELAY_MS:1000}
crm.whatsapp.ai.secrets.master-key=${AI_SECRETS_MASTER_KEY:}
# Protección adicional: la limpieza destructiva se rechaza si la URL no apunta a localhost.
crm.whatsapp.legacy-ai-cleanup-enabled=${CRM_LEGACY_AI_CLEANUP_ENABLED:true}
# Crea/verifica el esquema aditivo del agente nuevo en la base MySQL configurada.
crm.whatsapp.agent-schema-enabled=${CRM_WHATSAPP_AGENT_SCHEMA_ENABLED:true}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:KIMENTS}
brevo.reply-to-email=${BREVO_REPLY_TO_EMAIL:}
ecommerce.frontend-url=${ECOMMERCE_FRONTEND_URL:http://localhost:3000}
crm.whatsapp.ai.ecommerce-base-url=${ECOMMERCE_PUBLIC_URL:https://kiments.com.pe}
ecommerce.cache.revalidate-url=${ECOMMERCE_REVALIDATE_URL:}
ecommerce.cache.revalidate-secret=${ECOMMERCE_REVALIDATE_SECRET:}

# WhatsApp bridge CRM
whatsapp.bridge.url=${WHATSAPP_BRIDGE_URL:http://localhost:8095}
whatsapp.bridge.token=${WHATSAPP_BRIDGE_TOKEN:valor_seguro}
whatsapp.bridge.client-id=${WHATSAPP_SALES_CLIENT_ID:kiments-sales}

# Cloudflare Turnstile checkout
turnstile.enabled=${TURNSTILE_ENABLED:false}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
turnstile.siteverify-url=${TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
# Catalogo local de agencias Shalom
crm.whatsapp.shalom.api-url=https://api.shalom-api.lat/public/agencies
crm.whatsapp.shalom.connect-timeout-seconds=8
crm.whatsapp.shalom.initial-delay-ms=12000
crm.whatsapp.shalom.sync-delay-ms=86400000
